<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CashBee Admin v3</title>
<style>body{font-family:Arial;background:#f4f6fb;margin:0;color:#172033}.wrap{max-width:1000px;margin:auto;padding:18px}.head{background:linear-gradient(135deg,#4b22d8,#7a52ff);color:#fff;padding:22px;border-radius:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.card{background:#fff;padding:18px;border-radius:16px;border:1px solid #e5e7ef}.big{font-size:25px;font-weight:800;margin-top:8px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:11px;border-bottom:1px solid #eee;text-align:left}@media(max-width:700px){.grid{grid-template-columns:1fr}table{font-size:12px}}</style></head><body><div class="wrap"><div class="head"><h1>🐝 CashBee Admin</h1><p>Staging dashboard</p></div><div class="grid"><div class="card">Total Deposits<div class="big" id="d">₹0</div></div><div class="card">Total Cashback<div class="big" id="c">₹0</div></div><div class="card">Transactions<div class="big" id="n">0</div></div></div><h2>Transactions</h2><table><thead><tr><th>ID</th><th>Deposit</th><th>Cashback</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table><p style="font-size:12px;color:#667085">Local demo only. Production admin needs authentication, role-based access, audit logs and server-side data.</p></div><script>const x=JSON.parse(localStorage.getItem("cashbee-v3")||"{}"),tx=x.tx||[],m=n=>"₹"+Number(n||0).toLocaleString("en-IN");d.textContent=m(x.deposit);c.textContent=m(x.cashback);n.textContent=tx.length;rows.innerHTML=tx.map(t=>`<tr><td>${t.id}</td><td>${m(t.amount)}</td><td>${m(t.cashback)}</td><td>${t.date}</td></tr>`).join("")</script></body></html>
